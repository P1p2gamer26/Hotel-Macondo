spring.application.name=macondo
spring.profiles.default=dev
server.port = 8080
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true
wompi.environment=${WOMPI_ENVIRONMENT:test}
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}
wompi.frontend-base-url=${WOMPI_FRONTEND_BASE_URL:http://localhost:4200}
# Gmail SMTP para el remitente compartido del proyecto
