<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragmentos :: cabecera('Detalle de servicio | Hotel Macondo')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/servicios.css}" />
  </head>
  <body class="service-page">
    <header th:replace="~{fragments/header :: header}"></header>

    <main>
      <section
        class="service-detail-hero"
        th:style="'background-image: url(' + @{${servicio.imagen}} + ')'"
        th:attr="aria-label=${servicio.nombre}"
      >
        <div class="services-hero-overlay"></div>
        <div class="service-detail-hero-content">
          <span class="detail-category" th:text="${servicio.categoria}"></span>
          <h1 th:text="${servicio.nombre}"></h1>
          <div class="detail-hero-meta">
            <span>
              <i class="bi bi-clock" aria-hidden="true"></i>
              <span th:text="${servicio.horario}"></span>
            </span>
            <strong th:text="'Desde $' + ${#numbers.formatInteger(servicio.precio, 1, 'POINT')} + ' COP por sesión'"></strong>
          </div>
        </div>
      </section>

      <nav class="service-breadcrumb" aria-label="Migas de pan">
        <a th:href="@{/}">Inicio</a>
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
        <a th:href="@{/servicios}">Servicios</a>
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
        <span th:text="${servicio.nombre}"></span>
      </nav>

      <section class="service-detail-layout">
        <div class="service-detail-copy">
          <blockquote>
            Un santuario de paz inspirado en los rituales ancestrales del Caribe colombiano.
          </blockquote>
          <p th:text="${servicio.descripcionDetalle}"></p>

          <h2>¿Qué incluye?</h2>
          <ul class="detail-includes-grid">
            <li th:each="incluido : ${servicio.incluidos}">
              <i class="bi bi-check-circle" aria-hidden="true"></i>
              <span th:text="${incluido}"></span>
            </li>
          </ul>

          <div class="service-tags" aria-label="Etiquetas del servicio">
            <span th:each="etiqueta : ${servicio.etiquetas}" th:text="${etiqueta}"></span>
          </div>

          <section class="related-services" aria-labelledby="related-title">
            <h2 id="related-title">Otros servicios</h2>
            <div class="related-services-grid">
              <article th:each="relacionado : ${relacionados}">
                <img th:src="@{${relacionado.imagen}}" th:alt="${relacionado.nombre}" />
                <div>
                  <span th:text="${relacionado.categoria}"></span>
                  <h3 th:text="${relacionado.nombre}"></h3>
                  <p th:text="${relacionado.descripcion}"></p>
                  <a th:href="@{/servicios/{id}(id=${relacionado.id})}">
                    Ver más <i class="bi bi-arrow-right" aria-hidden="true"></i>
                  </a>
                </div>
              </article>
            </div>
          </section>
        </div>

        <aside class="service-info-card" aria-labelledby="service-info-title">
          <h2 id="service-info-title">Información del servicio</h2>
          <div class="service-info-price">
            <span>Precio</span>
            <strong th:text="'Desde $' + ${#numbers.formatInteger(servicio.precio, 1, 'POINT')} + ' COP por sesión'"></strong>
          </div>
          <section>
            <h3>Horario</h3>
            <p th:text="${servicio.horario}"></p>
          </section>
          <section>
            <h3>Incluye</h3>
            <ul>
              <li
                th:each="incluido, estado : ${servicio.incluidos}"
                th:if="${estado.index < 4}"
              >
                <i class="bi bi-check-circle" aria-hidden="true"></i>
                <span th:text="${incluido}"></span>
              </li>
            </ul>
            <a
              class="included-more"
              href="#"
              th:if="${servicio.incluidos.size() > 4}"
              th:text="'+' + ${servicio.incluidos.size() - 4} + ' más incluidos'"
            ></a>
          </section>
          <button
            class="button button-gold info-add-button"
            type="button"
            th:attr="data-add-service=${servicio.nombre}"
          >
            Agregar a mi estadía
          </button>
          <a class="active-reservations-link" href="#">Ver mis reservas activas</a>
        </aside>
      </section>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:src="@{/js/script.js}"></script>
    <script th:src="@{/js/servicios.js}"></script>
  </body>
</html>
