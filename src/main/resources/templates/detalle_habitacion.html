<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: cabecera('Habitación | Hotel Macondo')}"></head>
  <body>
    <nav th:replace="~{fragmentos :: navbar}"></nav>

    <main class="container py-5">
      <div class="row g-5 align-items-center">
        <div class="col-lg-6">
          <img
            class="img-fluid rounded-4 shadow"
            th:src="@{${habitacion.imagen}}"
            th:alt="${habitacion.nombre}"
          />
        </div>
        <div class="col-lg-6">
          <p class="seccion-etiqueta" th:text="${habitacion.etiqueta}"></p>
          <h1 class="display-5 mb-3" th:text="${habitacion.nombre}"></h1>
          <p class="fs-5" th:text="${habitacion.descripcion}"></p>

          <ul class="list-unstyled my-4">
            <li class="mb-2">
              <i class="bi bi-people-fill text-dorado me-2"></i>
              Hasta <span th:text="${habitacion.capacidad}"></span> huéspedes
            </li>
            <li class="mb-2">
              <i class="bi bi-wifi text-dorado me-2"></i> WiFi de alta velocidad
            </li>
            <li class="mb-2">
              <i class="bi bi-cup-hot-fill text-dorado me-2"></i> Desayuno
              caribeño incluido
            </li>
            <li class="mb-2">
              <i class="bi bi-water text-dorado me-2"></i> Acceso a playa privada
              y piscina infinity
            </li>
          </ul>

          <p class="mb-4">
            <small class="text-uppercase text-muted">Desde</small><br />
            <span
              class="precio fs-2"
              th:text="'$' + ${#numbers.formatInteger(habitacion.precio, 1, 'POINT')}"
            ></span>
            <small>/noche</small>
          </p>

          <!-- AQUI VA TODO LO DE RESERVAR: este boton debe llevar a
               @{/reservas/add(tipoHabitacion=${habitacion.nombre})} para que
               el formulario llegue con la habitacion ya seleccionada. -->
          <a class="btn btn-dorado btn-lg" href="#">Reservar Ahora</a>
          <a class="btn btn-borde-azul btn-lg ms-2" th:href="@{/habitaciones}"
            >Volver</a
          >
        </div>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: footer}"></footer>
    <th:block th:replace="~{fragmentos :: scripts}"></th:block>
  </body>
</html>
