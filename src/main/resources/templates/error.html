<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragmentos :: cabecera('Hotel Macondo | Algo salió mal')}"
  ></head>

  <body
    class="min-h-screen bg-[var(--crema-claro)] text-[var(--texto)] font-sans"
  >
    <main
      class="min-h-screen flex items-center justify-center px-4 py-10 sm:px-6"
      style="
        background-image:
          linear-gradient(rgba(247, 231, 211, 0.72), rgba(253, 246, 236, 0.94)),
          url(&quot;/images/Playa.avif&quot;);
        background-size: cover;
        background-position: center;
      "
    >
      <section
        class="w-full max-w-2xl overflow-hidden rounded-[18px] bg-white/95 text-center shadow-2xl"
        aria-labelledby="titulo-error"
      >
        <div class="h-2 bg-[var(--dorado)]"></div>

        <div class="px-6 py-12 sm:px-14 sm:py-16">
          <div
            class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-[var(--crema)]"
          >
            <th:block th:replace="~{fragmentos :: logo}"></th:block>
          </div>

          <p
            class="mb-3 text-xs font-bold uppercase tracking-[3px] text-[var(--azul)]"
          >
            Una pausa en el viaje
          </p>
          <h1
            id="titulo-error"
            class="mb-5 font-serif text-4xl font-bold text-[var(--azul-oscuro)] sm:text-5xl"
          >
            Algo salió mal
          </h1>
          <p
            class="mx-auto mb-8 max-w-lg text-base leading-relaxed sm:text-lg"
            th:text="${mensaje}"
          >
            No pudimos completar tu solicitud en este momento. Regresa al hotel
            y vuelve a intentarlo.
          </p>

          <div class="flex flex-wrap justify-center gap-3">
            <a
              class="rounded-lg border-2 border-[var(--azul)] bg-[var(--azul)] px-6 py-3 font-bold text-white transition hover:border-[var(--azul-oscuro)] hover:bg-[var(--azul-oscuro)]"
              th:href="@{/}"
            >
              <i class="bi bi-house-door mr-2" aria-hidden="true"></i>
              Volver al inicio
            </a>
            <!-- Botón para regresar a la página anterior -->
            <button
              class="rounded-lg border-2 border-[var(--azul)] px-6 py-3 font-bold text-[var(--azul)] transition hover:bg-[var(--azul)] hover:text-white"
              type="button"
              onclick="window.history.back()"
            >
              <i class="bi bi-arrow-left mr-2" aria-hidden="true"></i>
              Regresar
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
