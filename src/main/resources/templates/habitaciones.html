<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragmentos :: cabecera('Habitaciones | Hotel Macondo')}"
  ></head>

  <!-- Inyectamos el color base del texto y fondo para toda la pagina -->
  <body class="bg-white text-[var(--texto)] font-sans">
    <nav th:replace="~{fragmentos :: navbar}"></nav>

    <!-- Eliminacion de clase encabezado-interno para usar fondo y espaciados puros de Tailwind -->
    <header class="bg-[var(--crema)] py-16 text-center px-4">
      <p
        class="text-[var(--azul)] text-[0.8rem] font-bold tracking-[3px] uppercase mb-2 block"
      >
        Hospedaje
      </p>
      <h1
        class="text-4xl md:text-5xl font-serif font-bold text-[var(--azul-oscuro)] mb-4"
      >
        Nuestras Habitaciones
      </h1>
      <p class="max-w-2xl mx-auto text-[var(--texto)] mb-0">
        Cada espacio es un portal a otro mundo, diseñado para que el tiempo se
        detenga y la magia comience.
      </p>
    </header>

    <!-- Reemplazamos el contenedor de Bootstrap por container mx-auto px-4 -->
    <main class="container mx-auto px-4 py-16">
      <!-- Mensajes de filtrado estilizados con Tailwind -->
      <p
        class="text-center mb-10 text-[var(--texto)] text-lg"
        th:if="${personas != null}"
      >
        Habitaciones para
        <strong
          class="text-[var(--azul-oscuro)] font-bold"
          th:text="${personas}"
        ></strong>
        persona(s).
        <a
          class="text-[var(--azul)] font-bold hover:underline ml-2"
          th:href="@{/habitaciones}"
          >Ver todas</a
        >
      </p>

      <p
        class="text-center mb-10 text-red-500 font-medium text-lg bg-red-50 py-4 rounded-lg"
        th:if="${habitaciones.isEmpty()}"
      >
        No tenemos habitaciones con esa capacidad. Escríbenos y armamos algo a
        tu medida.
      </p>

      <!-- Reemplazo de row col-lg-3 por grid adaptativo -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Tarjeta de habitacion usando article en lugar de div generico -->
        <article
          class="bg-white rounded-[16px] overflow-hidden shadow-[0_8px_24px_rgba(0,0,0,0.08)] hover:shadow-[0_16px_34px_rgba(0,0,0,0.16)] hover:-translate-y-2 transition-all duration-300 relative flex flex-col h-full"
          th:each="habitacion : ${habitaciones}"
        >
          <img
            th:src="@{${habitacion.imagen}}"
            class="h-[200px] w-full object-cover"
            th:alt="${habitacion.nombre}"
          />

          <!-- Etiqueta sobre la imagen con paleta inyectada -->
          <span
            class="absolute top-[14px] left-[14px] bg-[var(--dorado)] text-[var(--azul-oscuro)] text-[0.7rem] font-bold tracking-[1px] px-[0.8rem] py-[0.3rem] rounded-[20px]"
            th:text="${habitacion.etiqueta}"
          ></span>

          <div class="p-5 flex flex-col flex-grow">
            <h3
              class="font-serif text-xl font-bold text-[var(--azul-oscuro)] mb-2"
              th:text="${habitacion.nombre}"
            ></h3>
            <p
              class="text-[var(--texto)] flex-grow mb-6 text-[0.95rem]"
              th:text="${habitacion.descripcion}"
            ></p>

            <div class="flex justify-between items-end mt-auto">
              <div>
                <small class="uppercase text-gray-400 text-xs font-bold"
                  >Desde</small
                ><br />
                <span
                  class="font-serif text-[1.4rem] font-bold text-[var(--azul-oscuro)]"
                  th:text="'$' + ${#numbers.formatInteger(habitacion.precio, 1, 'POINT')}"
                ></span>
                <small class="text-gray-400 text-xs">/noche</small>
              </div>

              <!-- Boton ver mas con las variables nativas -->
              <a
                class="border-2 border-[var(--azul)] text-[var(--azul)] font-bold rounded-[10px] px-4 py-2 hover:bg-[var(--azul)] hover:text-white transition text-sm"
                th:href="@{/habitaciones/{id}(id=${habitacion.id})}"
                >Ver más</a
              >
            </div>
          </div>
        </article>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: footer}"></footer>
    <th:block th:replace="~{fragmentos :: scripts}"></th:block>
  </body>
</html>
