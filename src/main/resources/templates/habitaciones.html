<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: cabecera('Habitaciones | Hotel Macondo')}"></head>
  <body>
    <nav th:replace="~{fragmentos :: navbar}"></nav>

    <header class="encabezado-interno text-center">
      <p class="seccion-etiqueta">Hospedaje</p>
      <h1 class="display-4">Nuestras Habitaciones</h1>
      <p class="seccion-texto mb-0">
        Cada espacio es un portal a otro mundo, diseñado para que el tiempo se
        detenga y la magia comience.
      </p>
    </header>

    <main class="container py-5">
      <p class="text-center" th:if="${personas != null}">
        Habitaciones para
        <strong th:text="${personas}"></strong> persona(s).
        <a th:href="@{/habitaciones}">Ver todas</a>
      </p>

      <p class="text-center" th:if="${habitaciones.isEmpty()}">
        No tenemos habitaciones con esa capacidad. Escríbenos y armamos algo a tu
        medida.
      </p>

      <div class="row g-4">
        <div class="col-lg-3 col-md-6" th:each="habitacion : ${habitaciones}">
          <div class="card card-habitacion h-100 position-relative">
            <img
              th:src="@{${habitacion.imagen}}"
              class="card-img-top"
              th:alt="${habitacion.nombre}"
            />
            <span class="etiqueta-habitacion" th:text="${habitacion.etiqueta}"></span>
            <div class="card-body d-flex flex-column">
              <h3 class="h4" th:text="${habitacion.nombre}"></h3>
              <p class="flex-grow-1" th:text="${habitacion.descripcion}"></p>
              <div class="d-flex justify-content-between align-items-end">
                <div>
                  <small class="text-uppercase text-muted">Desde</small><br />
                  <span
                    class="precio"
                    th:text="'$' + ${#numbers.formatInteger(habitacion.precio, 1, 'POINT')}"
                  ></span>
                  <small>/noche</small>
                </div>
                <a
                  class="btn btn-borde-azul"
                  th:href="@{/habitaciones/{id}(id=${habitacion.id})}"
                  >Ver más</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: footer}"></footer>
    <th:block th:replace="~{fragmentos :: scripts}"></th:block>
  </body>
</html>
