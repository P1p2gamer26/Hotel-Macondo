<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Fragmentos del portal de operador</title>
  </head>
  <body>
    <!-- ===== MENU LATERAL DEL OPERADOR =====
         Mismo lenguaje visual que el menu de /admin (fondo azul oscuro, logo,
         iconos de Bootstrap y pastilla dorada en la seccion activa) para que
         los dos portales internos se vean como el mismo producto.
         La seccion activa llega en 'seccionActiva' desde OperadorController. -->
    <nav
      th:fragment="menu"
      class="w-full md:w-64 shrink-0 bg-[var(--azul-oscuro)] text-white md:min-h-screen p-6 flex flex-col justify-between"
    >
      <div>
        <a class="flex items-center gap-3 mb-10" th:href="@{/}">
          <img
            class="w-10 h-auto"
            th:src="@{/images/logo.png}"
            alt="Logo Hotel Macondo"
          />
          <span class="font-serif text-xl font-bold text-[var(--dorado)]"
            >Macondo</span
          >
        </a>

        <p class="text-[0.7rem] tracking-[3px] uppercase text-white/50 mb-4">
          Portal Operador
        </p>

        <div class="flex flex-col gap-1">
          <!-- th:classappend resalta el enlace de la seccion actual -->
          <a
            class="rounded-lg px-4 py-3 hover:bg-white/10 transition"
            th:classappend="${seccionActiva == 'reservas'} ? 'bg-[var(--dorado)] text-[var(--azul-oscuro)] font-bold hover:bg-[var(--dorado)]'"
            th:href="@{/operador/reservas}"
            ><i class="bi bi-journal-text mr-2"></i>Reservas</a
          >
          <a
            class="rounded-lg px-4 py-3 hover:bg-white/10 transition"
            th:classappend="${seccionActiva == 'cuenta'} ? 'bg-[var(--dorado)] text-[var(--azul-oscuro)] font-bold hover:bg-[var(--dorado)]'"
            th:href="@{/operador/cuenta}"
            ><i class="bi bi-receipt mr-2"></i>Cuenta Habitacion</a
          >
          <a
            class="rounded-lg px-4 py-3 hover:bg-white/10 transition"
            th:classappend="${seccionActiva == 'checkout'} ? 'bg-[var(--dorado)] text-[var(--azul-oscuro)] font-bold hover:bg-[var(--dorado)]'"
            th:href="@{/operador/checkout}"
            ><i class="bi bi-box-arrow-right mr-2"></i>Check-out</a
          >
        </div>

        <a
          class="block mt-10 text-sm text-white/60 hover:text-[var(--dorado)]"
          th:href="@{/}"
          ><i class="bi bi-arrow-left mr-1"></i>Volver al sitio</a
        >
      </div>

      <form class="mt-10" th:action="@{/login}" method="post">
        <button
          type="submit"
          class="w-full rounded-lg border border-white/20 px-4 py-2.5 text-sm text-white/70 hover:bg-white/10 hover:text-white transition"
        >
          <i class="bi bi-power mr-2"></i>Cerrar sesion
        </button>
      </form>
    </nav>

    <!-- ===== ENCABEZADO DE SECCION =====
         Copia del encabezado del panel admin para que titulo y bajada tengan
         el mismo tamano y espaciado en los dos portales. -->
    <header th:fragment="titulo(texto, bajada)" class="mb-8">
      <h1
        class="text-3xl md:text-4xl font-serif font-bold text-[var(--azul-oscuro)]"
        th:text="${texto}"
      ></h1>
      <p class="text-[var(--texto)] mt-1" th:text="${bajada}"></p>
    </header>
  </body>
</html>
