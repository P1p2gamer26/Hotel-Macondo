<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Fragmentos del portal de operador</title>
  </head>
  <body>
    <!-- ===== MENU LATERAL DEL OPERADOR =====
         Se saco de fragmentos.html (que agrupa lo del sitio publico)
         para que el portal de operador quede autocontenido, igual que
         el menu del panel de administracion. -->
    <nav
      th:fragment="menu"
      class="w-64 min-h-screen bg-white shadow-md flex flex-col justify-between p-6 border-r border-gray-100"
    >
      <!-- Bloque Superior: Logo + Menú -->
      <div class="flex flex-col gap-6">
        <!-- Encabezado Centrado -->
        <div class="text-center pb-4 border-b border-gray-100">
          <a th:href="@{/}" class="block">
            <h1
              class="text-2xl font-bold tracking-tight text-[var(--azul-oscuro)]"
            >
              Hotel Macondo
            </h1>
            <span
              class="text-xs text-gray-400 font-sans tracking-wide block mt-1"
            >
              Portal Operador
            </span>
          </a>
        </div>

        <!-- Menú Principal -->
        <div class="flex flex-col gap-2">
          <span
            class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 mb-1"
          >
            Menú Principal
          </span>

          <!-- La opción activa se determina según la ruta actual.
          Para identificar las pestañas se utiliza un operador ternario
          el cual usa la variable seccionActiva que le da el controlador -->
          <a
            th:href="@{/operador/reservas}"
            th:class="${seccionActiva == 'reservas'
            ? 'flex items-center gap-3 px-4 py-3 rounded-xl bg-[var(--crema-claro)] text-[var(--azul-oscuro)] font-bold border-l-4 border-[var(--dorado)] shadow-sm transition-all' 
            : 'flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all'}"
          >
            <svg
              th:class="${seccionActiva == 'reservas'
              ? 'w-5 h-5 stroke-[var(--azul-oscuro)]' : 'w-5 h-5 stroke-gray-500'}"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
              />
            </svg>
            <span>Reservas</span>
          </a>

          <!-- Cuenta Habitación -->
          <a
            th:href="@{/operador/cuenta}"
            th:class="${seccionActiva == 'cuenta'
            ? 'flex items-center gap-3 px-4 py-3 rounded-xl bg-[var(--crema-claro)] text-[var(--azul-oscuro)] font-bold border-l-4 border-[var(--dorado)] shadow-sm transition-all' 
            : 'flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all'}"
          >
            <svg
              th:class="${seccionActiva == 'cuenta'
              ? 'w-5 h-5 stroke-[var(--azul-oscuro)]' : 'w-5 h-5 stroke-gray-500'}"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2m0 0h6"
              />
            </svg>
            <span>Cuenta Habitación</span>
          </a>

          <!-- Check-out -->
          <a
            th:href="@{/operador/checkout}"
            th:class="${seccionActiva == 'checkout'
            ? 'flex items-center gap-3 px-4 py-3 rounded-xl bg-[var(--crema-claro)] text-[var(--azul-oscuro)] font-bold border-l-4 border-[var(--dorado)] shadow-sm transition-all' 
            : 'flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all'}"
          >
            <svg
              th:class="${seccionActiva == 'checkout'
              ? 'w-5 h-5 stroke-[var(--azul-oscuro)]' : 'w-5 h-5 stroke-gray-500'}"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
              />
            </svg>
            <span>Check-out</span>
          </a>
        </div>
      </div>

      <!-- Bloque Inferior: Usuario + Logout -->
      <div class="flex flex-col gap-4 pt-4 border-t border-gray-100">
        <!-- Perfil Usuario -->
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-full bg-[var(--dorado)] text-[var(--azul-oscuro)] font-bold flex items-center justify-center text-sm shadow-sm"
          >
            OP
          </div>
          <div class="flex flex-col">
            <span class="text-sm font-bold text-[var(--azul-oscuro)]"
              >Operador</span
            >
            <span class="text-xs text-gray-400">Operador</span>
          </div>
        </div>

        <!-- Botón Cerrar Sesión -->
        <form th:action="@{/login}" method="post">
          <button
            type="submit"
            class="w-full flex items-center justify-center gap-2 py-2.5 px-4 border border-gray-200 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-all"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />
            </svg>
            <span>Cerrar sesión</span>
          </button>
        </form>
      </div>
    </nav>
  </body>
</html>
