<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragmentos :: cabecera('Gestión de Reservas | Hotel Macondo')}"
  ></head>

  <body
    class="bg-[var(--crema-claro)] text-[var(--texto)] font-sans flex flex-col md:flex-row min-h-screen"
  >
    <!-- BARRA LATERAL (NAV OPERADOR) -->
    <nav th:replace="~{operador/fragmentos_operador :: menu}"></nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 p-6 md:p-10">
      <!-- ENCABEZADO (mismo fragmento de titulo que usa el panel admin) -->
      <header
        th:replace="~{operador/fragmentos_operador :: titulo('Reservas', 'Reservas registradas en el hotel y su estado actual.')}"
      ></header>

      <!-- TARJETAS DE MÉTRICAS (mismo estilo que el tablero de admin) -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <!-- 1. Total de reservas listadas -->
        <div class="bg-white rounded-2xl shadow-sm p-6">
          <div class="flex items-center justify-between mb-4">
            <span
              class="text-[0.7rem] tracking-[3px] uppercase text-[var(--azul)] font-bold"
              >Reservas</span
            >
            <i class="bi bi-clipboard-check text-2xl text-[var(--dorado)]"></i>
          </div>
          <p
            class="font-serif text-4xl font-bold text-[var(--azul-oscuro)]"
            th:text="${totalReservas}"
          ></p>
          <p class="mt-1 text-sm text-gray-500">En la lista actual</p>
        </div>

        <!-- 2. Activas -->
        <div class="bg-white rounded-2xl shadow-sm p-6">
          <div class="flex items-center justify-between mb-4">
            <span
              class="text-[0.7rem] tracking-[3px] uppercase text-[var(--azul)] font-bold"
              >Activas</span
            >
            <i class="bi bi-person-check text-2xl text-[var(--dorado)]"></i>
          </div>
          <p
            class="font-serif text-4xl font-bold text-[var(--azul-oscuro)]"
            th:text="${activas}"
          ></p>
          <p class="mt-1 text-sm text-gray-500">Huéspedes en el hotel</p>
        </div>

        <!-- 3. Confirmadas -->
        <div class="bg-white rounded-2xl shadow-sm p-6">
          <div class="flex items-center justify-between mb-4">
            <span
              class="text-[0.7rem] tracking-[3px] uppercase text-[var(--azul)] font-bold"
              >Confirmadas</span
            >
            <i class="bi bi-calendar-event text-2xl text-[var(--dorado)]"></i>
          </div>
          <p
            class="font-serif text-4xl font-bold text-[var(--azul-oscuro)]"
            th:text="${confirmadas}"
          ></p>
          <p class="mt-1 text-sm text-gray-500">Próximas llegadas</p>
        </div>

        <!-- 4. Canceladas -->
        <div class="bg-white rounded-2xl shadow-sm p-6">
          <div class="flex items-center justify-between mb-4">
            <span
              class="text-[0.7rem] tracking-[3px] uppercase text-[var(--azul)] font-bold"
              >Canceladas</span
            >
            <i class="bi bi-x-circle text-2xl text-[var(--dorado)]"></i>
          </div>
          <p
            class="font-serif text-4xl font-bold text-[var(--azul-oscuro)]"
            th:text="${canceladas}"
          ></p>
          <p class="mt-1 text-sm text-gray-500">Reservas anuladas</p>
        </div>
      </div>

      <!-- BARRA DE BÚSQUEDA Y FILTROS -->
      <div
        class="flex flex-col lg:flex-row gap-4 justify-between items-center mb-6"
      >
        <!-- Input de Búsqueda -->
        <div class="relative w-full lg:w-1/2">
          <i
            class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
          ></i>
          <input
            type="text"
            placeholder="Buscar código, cliente o habitación..."
            class="w-full bg-white rounded-xl pl-11 pr-4 py-2.5 border border-gray-200 text-sm focus:outline-none focus:border-[var(--azul)] text-[var(--texto)] shadow-sm"
          />
        </div>

        <!-- Filtros (Pills) -->
        <div
          class="flex flex-wrap gap-2 w-full lg:w-auto justify-start lg:justify-end text-xs font-semibold"
        >
          <a
            th:href="@{/operador/reservas(filtro='todas')}"
            class="px-5 py-2 rounded-full shadow-sm transition"
            th:classappend="${filtro == 'todas'} ? ' bg-[var(--azul)] text-white' : ' bg-white text-[var(--azul)] border border-[var(--azul)] hover:bg-blue-50'"
          >
            Todas
          </a>
          <a
            th:href="@{/operador/reservas(filtro='activas')}"
            class="px-5 py-2 rounded-full shadow-sm transition"
            th:classappend="${filtro == 'activas'} ? ' bg-[var(--azul)] text-white' : ' bg-white text-[var(--azul)] border border-[var(--azul)] hover:bg-blue-50'"
          >
            Activas
          </a>
        </div>
      </div>

      <!-- TABLA DE RESERVAS -->
      <div class="bg-white rounded-2xl shadow-sm overflow-x-auto">
          <table class="w-full text-left min-w-[960px]">
            <thead
              class="bg-[var(--crema)] text-[var(--azul-oscuro)] text-sm uppercase tracking-wider"
            >
              <tr>
                <th class="py-4 px-6">Código</th>
                <th class="py-4 px-6">Cliente</th>
                <th class="py-4 px-6">Habitación / Tipo</th>
                <th class="py-4 px-6">Entrada</th>
                <th class="py-4 px-6">Salida</th>
                <th class="py-4 px-6">Estado</th>
                <th class="py-4 px-6 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody class="text-sm font-medium text-[var(--texto)]">
              <tr
                class="border-t border-gray-100"
                th:each="reserva : ${reservas}"
              >
                <td
                  class="py-4 px-6 font-bold text-[var(--azul)]"
                  th:text="${reserva.numeroReserva}"
                ></td>
                <td
                  class="py-4 px-6 font-bold text-[var(--azul-oscuro)]"
                  th:text="${reserva.cliente.nombre + ' ' + reserva.cliente.apellido}"
                ></td>
                <td class="py-4 px-6 text-gray-600">
                  <span th:text="${reserva.habitacion.numero}"></span>
                  <span aria-hidden="true"> — </span>
                  <span
                    th:text="${reserva.habitacion.tipoHabitacion.nombre}"
                  ></span>
                </td>
                <td
                  class="py-4 px-6 text-gray-600"
                  th:text="${#temporals.format(reserva.fechaInicio, 'dd MMM yyyy')}"
                ></td>
                <td
                  class="py-4 px-6 text-gray-600"
                  th:text="${#temporals.format(reserva.fechaFin, 'dd MMM yyyy')}"
                ></td>
                <td class="py-4 px-6">
                  <span
                    class="inline-block px-4 py-1 rounded-full text-xs font-semibold border"
                    th:classappend="${reserva.estado == 'ACTIVA'} ? ' bg-sky-50 text-sky-600 border-sky-200' : (${reserva.estado == 'CANCELADA'} ? ' bg-red-50 text-red-600 border-red-200' : (${reserva.estado == 'FINALIZADA'} ? ' bg-emerald-50 text-emerald-700 border-emerald-200' : ' bg-amber-50 text-amber-700 border-amber-200'))"
                    th:text="${reserva.estado}"
                  ></span>
                </td>
                <!-- Acciones como enlaces de texto, igual que en el panel admin -->
                <td class="py-4 px-6 text-right whitespace-nowrap">
                  <!-- Detalle: cliente, habitación y cuenta de la reserva -->
                  <a
                    class="text-[var(--azul)] hover:underline font-medium"
                    th:href="@{/operador/reservas/{n}(n=${reserva.numeroReserva})}"
                    >Ver</a
                  >
                  <!-- Solo se pueden cancelar las reservas vigentes -->
                  <form
                    class="inline ml-4"
                    method="post"
                    th:if="${#strings.toUpperCase(reserva.estado) == 'CONFIRMADA' or #strings.toUpperCase(reserva.estado) == 'PENDIENTE'}"
                    th:action="@{/operador/reservas/{n}/cancelar(n=${reserva.numeroReserva})}"
                    onsubmit="return confirm('¿Cancelar la reserva?')"
                  >
                    <button
                      class="text-red-600 hover:underline font-medium"
                      type="submit"
                    >
                      Cancelar
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${reservas.isEmpty()}">
                <td class="py-10 px-6 text-center text-gray-500" colspan="7">
                  No hay reservas para el filtro seleccionado.
                </td>
              </tr>
            </tbody>
          </table>
      </div>
    </main>

    <!-- SCRIPTS -->
    <th:block th:replace="~{fragmentos :: scripts}"></th:block>
  </body>
</html>
